<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCCA — Chuyện của chúng ta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Be+Vietnam+Pro:wght@300;400&family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="heart.svg">
<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; background: #F6EFE2; }
  a { color: #7C4A2A; text-decoration: none; }
  a:hover { color: #4E2C16; }
  @keyframes riseIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  #musicBtn {
    position: fixed;
    right: 25px;
    bottom: 25px;

    width: 58px;
    height: 58px;

    border: 1px solid rgba(255,255,255,.8);
    border-radius: 50%;

    background: rgba(255, 182, 193, .9);
    color: white;

    font-size: 25px;
    cursor: pointer;

    box-shadow: 0 0 15px rgba(255, 105, 135, .45);

    z-index: 9999;

    /* Nhấp nháy */
    animation: attention 1.5s ease-in-out infinite;
  }

  /* Vòng sáng để thu hút sự chú ý */
  #musicBtn::before {
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1px solid rgba(255, 105, 135, .5);

    animation: ripple 1.8s ease-out infinite;
  }

  #musicBtn:hover {
    transform: scale(1.12);
  }

  /* Khi đang phát nhạc thì bỏ hiệu ứng "hãy click" */
  #musicBtn.playing {
    animation: none;
  }

  #musicBtn.playing::before {
    animation: musicPulse 1.5s ease-in-out infinite;
  }

  @keyframes attention {
    0%, 100% {
      transform: scale(1);
      opacity: 1;
    }

    50% {
      transform: scale(1.12);
      opacity: .7;
    }
  }

  @keyframes ripple {
    0% {
      transform: scale(.8);
      opacity: .8;
    }

    100% {
      transform: scale(1.5);
      opacity: 0;
    }
  }

  @keyframes musicPulse {
    0%, 100% {
      transform: scale(.9);
      opacity: .3;
    }

    50% {
      transform: scale(1.15);
      opacity: .7;
    }
  }

  /* ── Thư: phần giữa chỉ là các vệt mờ giả chữ, không có nội dung ── */
  .letter-card .ghost-line {
    display: flex;
    flex-wrap: nowrap;
    overflow: hidden;
    align-items: center;
    gap: .3em;
    height: 1.85em;
    max-width: 100%;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: none;
  }
  .letter-card .ghost-line i {
    display: block;
    flex: 0 1 auto;
    height: .75em;
    border-radius: 999px;
    background: rgba(58, 42, 28, .24);
    filter: blur(8px);
  }
  .letter-card .ghost-line.brown i { background: rgba(124, 74, 42, .28); }
  .letter-card .ghost-gap { height: .8em; }

  .letter-heading {
    margin: 0 0 clamp(18px, 2.6vw, 26px);
    font-family: 'Dancing Script', cursive;
    /*font-weight: 600;*/
    font-size: clamp(22px, 3.8vw, 22px);
    /*line-height: 1.3;*/
  }
  .letter-body {
    font-family: 'Dancing Script', cursive;
    font-weight: 400;
    font-size: clamp(18px, 2.2vw, 21px);
    line-height: 1.85;
  }
  .letter-body p { margin: 0 0 .8em; text-wrap: pretty; }
  .letter-body p:last-child { margin-bottom: 0; }
  .letter-foot {
    margin-top: clamp(26px, 4vw, 38px);
    padding-top: clamp(18px, 3vw, 23px);
    text-align: right;
  }
  .letter-date {
    margin: 0 0 clamp(6px, 1.2vw, 12px);
    font-family: 'Dancing Script', cursive;
    font-weight: 400;
    font-size: clamp(16px, 2.1vw, 19px);
    line-height: 1.4;
  }
  .letter-sign {
    font-family: 'Dancing Script', cursive;
    font-weight: 700;
    font-size: clamp(25px, 3.4vw, 32px);
  }


  /* ── Playlist ───────────────────────────────────────────── */
  #playlist {
    position: fixed;
    right: 25px;
    bottom: 95px;
    z-index: 9998;

    min-width: 210px;
    padding: 7px;

    background: rgba(251, 246, 234, .97);
    border: 1px solid rgba(51, 38, 27, .14);
    border-radius: 14px;
    box-shadow: 0 18px 40px -22px rgba(51, 38, 27, .55);

    font-family: 'Be Vietnam Pro', system-ui, sans-serif;

    /* Mặc định ẩn */
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px) scale(.96);
    transform-origin: bottom right;
    transition: opacity .25s ease, transform .25s ease, visibility .25s;
  }
  #playlist.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
  }

  #playlist .pl-title {
    padding: 6px 10px 8px;
    font-size: 10px;
    font-weight: 300;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: #A0907C;
  }

  #playlist .track {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 9px 11px;

    border: 0;
    border-radius: 9px;
    background: transparent;

    font: inherit;
    font-size: 13px;
    font-weight: 400;
    color: #5A4733;
    text-align: left;
    cursor: pointer;

    transition: background .2s ease, color .2s ease;
  }
  #playlist .track:hover { background: rgba(51, 38, 27, .06); }
  #playlist .track.active {
    background: rgba(255, 182, 193, .28);
    color: #7C4A2A;
    font-weight: 500;
  }
  /* Chấm tròn / nốt nhạc ở đầu mỗi bài */
  #playlist .track .dot {
    flex: 0 0 auto;
    width: 14px;
    font-size: 11px;
    color: #C9B49A;
  }
  #playlist .track.active .dot { color: #E8899B; }
</style>
</head>
<body>

<div style="background:#F6EFE2;color:#33261B;font-family:Lora,Georgia,'Times New Roman',serif;font-weight:400;overflow-x:hidden">

  <section style="position:relative;padding:clamp(56px,9vw,120px) clamp(20px,5vw,64px) clamp(56px,8vw,100px)">
    <div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg, rgba(51,38,27,.035) 0 1px, rgba(51,38,27,0) 1px 4px);pointer-events:none"></div>
    <div style="position:relative;max-width:1000px;margin:0 auto;text-align:center">
      <p style="margin:0 0 clamp(22px,3vw,34px);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-weight:300;font-size:12px;letter-spacing:.36em;text-transform:uppercase;color:#6E5A46;animation:riseIn .9s ease both">Chuyện của chúng ta</p>
      <h1 style="margin:0;font-weight:500;font-size:clamp(58px,15vw,168px);line-height:.92;letter-spacing:.02em;animation:riseIn 1s ease .1s both">TCCA</h1>
      <p style="max-width:36ch;margin:clamp(22px,4vw,36px) auto 0;font-size:clamp(17px,2.3vw,20px);line-height:1.75;color:#6B5847;text-wrap:pretty;animation:riseIn 1s ease .2s both">Một trang nhỏ để giữ lại những gì mình không muốn quên và những gì đã từng rất thật.</p>

      <figure style="position:relative;width:min(820px,100%);margin:clamp(40px,6vw,72px) auto 0;animation:riseIn 1.1s ease .3s both">
        <img src="/design/foscthfoscthfosc.png" alt="Hai người nắm tay nhau nhìn ra biển"
             width="2400" height="1792" loading="lazy" decoding="async"
             style="display:block;width:100%;height:auto;border-radius:4px;border:1px solid rgba(51,38,27,.12);box-shadow:0 26px 60px -40px rgba(51,38,27,.6)">
      </figure>
    </div>
  </section>

  <section style="padding:clamp(28px,5vw,64px) clamp(20px,5vw,64px) clamp(72px,10vw,140px);background:#EFE6D6;border-top:1px solid rgba(51,38,27,.10)">
    <div class="letter-card" style="max-width:720px;margin:0 auto;background:#FBF6EA;border:1px solid rgba(51,38,27,.12);padding:clamp(30px,6vw,68px);box-shadow:0 22px 50px -38px rgba(51,38,27,.5)">
      <p class="letter-heading" style="color:#7C4A2A">Gửi TCCA,</p>
      <div class="letter-body" aria-hidden="true">
          <div class="ghost-line"><i style="width:3.2em"></i><i style="width:2.1em"></i><i style="width:4.4em"></i><i style="width:1.6em"></i><i style="width:3.8em"></i><i style="width:2.6em"></i><i style="width:5.1em"></i><i style="width:2.2em"></i><i style="width:3.3em"></i></div>
          <div class="ghost-line"><i style="width:4.1em"></i><i style="width:2.8em"></i><i style="width:1.9em"></i><i style="width:3.6em"></i><i style="width:2.4em"></i><i style="width:4.7em"></i><i style="width:3.0em"></i><i style="width:2.2em"></i></div>
          <div class="ghost-line"><i style="width:2.6em"></i><i style="width:3.4em"></i><i style="width:2.0em"></i><i style="width:5.2em"></i><i style="width:1.8em"></i><i style="width:3.1em"></i></div>
          <div class="ghost-gap"></div>
          <div class="ghost-line"><i style="width:3.6em"></i><i style="width:2.3em"></i><i style="width:4.0em"></i><i style="width:1.7em"></i><i style="width:3.2em"></i><i style="width:2.9em"></i><i style="width:4.6em"></i><i style="width:2.1em"></i><i style="width:2.8em"></i></div>
          <div class="ghost-line"><i style="width:2.4em"></i><i style="width:4.3em"></i><i style="width:3.1em"></i><i style="width:2.0em"></i><i style="width:3.8em"></i><i style="width:2.7em"></i><i style="width:4.4em"></i><i style="width:1.9em"></i></div>
          <div class="ghost-line"><i style="width:3.9em"></i><i style="width:2.2em"></i><i style="width:4.8em"></i><i style="width:2.6em"></i></div>
          <div class="ghost-gap"></div>
          <div class="ghost-line brown"><i style="width:2.8em"></i><i style="width:3.5em"></i><i style="width:4.1em"></i><i style="width:2.2em"></i><i style="width:3.7em"></i><i style="width:4.9em"></i><i style="width:2.4em"></i></div>
      </div>
      <div class="letter-foot">
        <p class="letter-date" style="color:#6E5A46">Hà Nội, Ngày... Tháng... Năm...</p>
      </div>
    </div>
    <p style="margin:clamp(40px,6vw,64px) 0 0;text-align:center;font-family:'Be Vietnam Pro',system-ui,sans-serif;font-weight:300;font-size:12px;letter-spacing:.36em;text-transform:uppercase;color:#6E5A46">TCCA</p>
  </section>

</div>
<audio id="bgMusic"></audio>

<div id="playlist" role="listbox" aria-label="Danh sách bài hát">
  <div class="pl-title">Nhạc nền</div>
</div>

<button id="musicBtn" aria-label="Phát nhạc">
  ♡
</button>
<script>
  const PLAYLIST = [
    { src: "guinganloiyeu.mp3",  title: "Gửi Ngàn Lời Yêu" },
    { src: "votinhdanhroi.mp3",  title: "Vô Tình Đánh Rơi" }
  ];

  const music    = document.getElementById("bgMusic");
  const musicBtn = document.getElementById("musicBtn");
  const panel    = document.getElementById("playlist");

  let current = 0;

  // Dựng danh sách bài hát
  PLAYLIST.forEach(function (t, i) {
    const b = document.createElement("button");
    b.className = "track";
    b.type = "button";
    b.innerHTML = '<span class="dot">○</span><span>' + t.title + '</span>';
    b.addEventListener("click", function () { selectTrack(i); });
    panel.appendChild(b);
  });
  const trackEls = panel.querySelectorAll(".track");

  function syncUI() {
    const playing = !music.paused;
    musicBtn.innerHTML = playing ? "♫" : "♡";
    musicBtn.classList.toggle("playing", playing);

    trackEls.forEach(function (el, i) {
      const active = i === current;
      el.classList.toggle("active", active);
      el.querySelector(".dot").textContent = (active && playing) ? "♪" : "○";
    });
  }

  function selectTrack(i) {
    current = (i + PLAYLIST.length) % PLAYLIST.length;
    music.src = PLAYLIST[current].src;
    music.play().catch(function () { syncUI(); });
    panel.classList.add("open");
  }

  musicBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    if (music.paused) {
      if (!music.src) { selectTrack(current); }
      else { music.play().catch(function () {}); panel.classList.add("open"); }
    } else {
      music.pause();
    }
  });

  // Hết bài thì tự chuyển sang bài kế, hết danh sách thì quay lại đầu
  music.addEventListener("ended", function () { selectTrack(current + 1); });
  music.addEventListener("play",  syncUI);
  music.addEventListener("pause", syncUI);

  // Bấm ra ngoài để đóng danh sách
  document.addEventListener("click", function (e) {
    if (!panel.contains(e.target)) { panel.classList.remove("open"); }
  });

  syncUI();
</script>
</body>
</html>
